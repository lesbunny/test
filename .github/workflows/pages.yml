name: Deploy Little Light to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate browser app
        run: |
          node --check site/extension.js
          node --check site/app.js
          node --check site/inventory-core.js
          node --check site/native-core.js
          node --check site/native-tools.js
          node --check site/tools.js
          node --check site/workspace-ui.js
          node --test tests/*.test.cjs
          node --input-type=commonjs -e 'const fs=require("node:fs"),vm=require("node:vm"),html=fs.readFileSync("site/index.html","utf8");const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(s=>s.trim());scripts.forEach((s,i)=>new vm.Script(s,{filename:"inline-app-"+i+".js"}));console.log("Validated "+scripts.length+" inline script(s).");'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -a site/. _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
