name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and tests
        run: python -m py_compile arch.py test_gh.py smoke_test.py
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          import re
          source = open("arch.py", encoding="utf-8").read()
          matches = re.findall(r"<script>(.*?)</script>", source, re.S)
          if len(matches) != 1:
              raise SystemExit(f"Expected one embedded script, found {len(matches)}")
          open("/tmp/arch-ui.js", "w", encoding="utf-8").write(matches[0])
          PY
          node --check /tmp/arch-ui.js
      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser UI smoke test
        run: python smoke_test.py
      - name: Run GitHub integration regression tests
        run: python test_gh.py
